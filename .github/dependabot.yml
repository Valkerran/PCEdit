# Watches the dependency graph for updates and security fixes (#40).
#
# github-actions: the workflows pin every action to a full commit SHA with the version in a
# trailing comment; Dependabot bumps both together, which is what keeps SHA pinning
# maintainable.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /PCEdit.SaveFileHandler
      - /PCEdit.App.Core
      - /PCEdit.Desktop
      - /PCEdit.SaveFileHandler.Tests
      - /PCEdit.App.Core.Tests
      - /PCEdit.Desktop.Tests
    schedule:
      interval: weekly
    groups:
      # The Avalonia packages must move in lockstep.
      avalonia:
        patterns: ["Avalonia*"]
      # Both test projects pin the same test stack. Without a group covering majors, each
      # major bump arrived as one PR per project directory, and merging just one would
      # leave the two projects on different majors.
      test-tooling:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # App-local ICU for the Linux AppImage. Its version is also the libicu filename suffix
      # the runtime is told to load, and a bump changes the AppImage size - upgrade it by
      # hand and re-run the distro matrix (deploy/README.md), not from a bot PR.
      - dependency-name: Microsoft.ICU.ICU4C.Runtime*
      # A major of xunit.v3 is a migration, not a bump: 4.x reorganises the packages around
      # Microsoft.Testing.Platform 2.x, which does not run under the classic `dotnet test` on the
      # .NET 10 SDK, and Avalonia.Headless.XUnit is built against 3.x (PR #138). The pattern
      # covers xunit.v3.mtp-off, the variant the UI tests reference (issue #143). Minor and
      # patch updates still come.
      - dependency-name: xunit.v3*
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
