# Watches the dependency graph for updates and security fixes (#40).
#
# github-actions: the workflows pin every action to a full commit SHA with the version in a
# trailing comment; Dependabot bumps both together, which is what keeps SHA pinning
# maintainable.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /PCEdit.SaveFileHandler
      - /PCEdit.App.Core
      - /PCEdit.Desktop
      - /PCEdit.SaveFileHandler.Tests
      - /PCEdit.App.Core.Tests
    schedule:
      interval: weekly
    groups:
      # Group Avalonia package updates within this scope.
      avalonia:
        patterns: ["Avalonia*"]
      # The non-UI test projects pin the same test stack. Without a group covering majors, each
      # major bump arrived as one PR per project directory, and merging just one would
      # leave the two projects on different majors.
      test-tooling:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # App-local ICU for the Linux AppImage. Its version is also the libicu filename suffix
      # the runtime is told to load, and a bump changes the AppImage size - upgrade it by
      # hand and re-run the distro matrix (deploy/README.md), not from a bot PR.
      - dependency-name: Microsoft.ICU.ICU4C.Runtime*

  # Separate scope so the headless runner's xUnit pin does not hold back non-UI tests.
  - package-ecosystem: nuget
    directory: /PCEdit.Desktop.Tests
    schedule:
      interval: weekly
    groups:
      avalonia:
        patterns: ["Avalonia*"]
      test-tooling:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: Microsoft.ICU.ICU4C.Runtime*
      # Keep xUnit at 3.2.2 until Avalonia's headless runner supports xUnit 4.
      # https://github.com/AvaloniaUI/Avalonia/issues/22072
      # Remove this ignore when upgrading the runner and xUnit together.
      - dependency-name: xunit.v3*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
