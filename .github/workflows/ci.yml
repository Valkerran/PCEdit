name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test — PCEdit.SaveFileHandler
        run: dotnet test PCEdit.SaveFileHandler.Tests/PCEdit.SaveFileHandler.Tests.csproj -c Release

      - name: Test — PCEdit.App.Core (incl. localization catalog parity)
        run: dotnet test PCEdit.App.Core.Tests/PCEdit.App.Core.Tests.csproj -c Release

      - name: Build — PCEdit.Desktop
        run: dotnet build PCEdit.Desktop/PCEdit.Desktop.csproj -c Release

      # The AppImage is only assembled at release time, so guard the ICU wiring here:
      # without it the Linux build FailFasts at startup on a distro with no system libicu.
      - name: Linux publish carries app-local ICU
        shell: bash
        run: |
          dotnet publish PCEdit.Desktop/PCEdit.Desktop.csproj -c Release -r linux-x64 --self-contained true -o "$RUNNER_TEMP/icu-check"
          deploy/verify-app-local-icu.sh "$RUNNER_TEMP/icu-check"

      # A hand-edit of a generated file, or a generator edit that was never re-run, both
      # show up here as a diff.
      - name: Generated files are in sync with their generators
        run: |
          python3 tools/i18n/gen_satellites.py
          python3 tools/i18n/gen_metainfo.py
          python3 tools/item-catalog/gen_catalog.py
          git diff --exit-code --ignore-cr-at-eol -- \
            'PCEdit.App.Core/Resources/Strings.*.resx' \
            deploy/com.valkerran.pcedit.metainfo.xml \
            PCEdit.App.Core/Data/ItemCatalog.json

  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: <VersionPrefix> is well-formed and not behind the latest release tag
        shell: bash
        run: |
          set -euo pipefail
          v="$(sed -n 's|.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*|\1|p' Directory.Build.props)"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=Directory.Build.props::<VersionPrefix> '$v' is not X.Y.Z"; exit 1
          fi
          latest="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n1)"
          if [ -n "$latest" ]; then
            newest="$(printf '%s\n%s\n' "$v" "$latest" | sort -V | tail -n1)"
            if [ "$v" = "$latest" ]; then
              echo "::warning file=Directory.Build.props::<VersionPrefix> $v already matches release tag v$latest - bump it before the next release."
            elif [ "$newest" != "$v" ]; then
              echo "::error file=Directory.Build.props::<VersionPrefix> $v is behind the latest release tag v$latest"; exit 1
            fi
          fi
