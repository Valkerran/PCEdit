name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

# The .NET SDK reports each command it runs to Microsoft unless told not to. The README says
# building PCEdit does not phone home, so the project's own pipelines must not either.
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Locked: GitHub sets CI=true, which turns on RestoreLockedMode (Directory.Build.props), so
      # this fails with NU1004 if any project's dependencies drift from its packages.lock.json.
      - name: Restore (locked)
        run: dotnet restore PCEdit.slnx

      - name: Test — PCEdit.SaveFileHandler
        run: dotnet test PCEdit.SaveFileHandler.Tests/PCEdit.SaveFileHandler.Tests.csproj -c Release --no-restore

      - name: Test — PCEdit.App.Core (incl. localization catalog parity)
        run: dotnet test PCEdit.App.Core.Tests/PCEdit.App.Core.Tests.csproj -c Release --no-restore

      - name: Build — PCEdit.Desktop
        run: dotnet build PCEdit.Desktop/PCEdit.Desktop.csproj -c Release --no-restore

      # Headless: Avalonia's test platform needs no display. This project is on xUnit v3 (the
      # headless package is built on it); the other two test projects stay on xUnit 2.
      - name: Test — PCEdit.Desktop (headless UI)
        run: dotnet test PCEdit.Desktop.Tests/PCEdit.Desktop.Tests.csproj -c Release --no-restore

      # Nothing in a build log shows that the Avalonia build-time telemetry task is absent, so
      # a dropped or stale PackageReference would silently restore it. See the comment on the
      # Avalonia.BuildServices reference in PCEdit.Desktop.csproj.
      # Both projects that reference Avalonia: the UI tests pull it in through the headless
      # package, so they need the same exclusion as the app itself.
      - name: Desktop build has Avalonia telemetry excluded
        shell: bash
        run: |
          set -euo pipefail
          for project in PCEdit.Desktop PCEdit.Desktop.Tests; do
            f=$project/obj/$project.csproj.nuget.g.targets
            if [[ ! -f "$f" ]]; then
              echo "::error::$f not found - did the $project restore run?"; exit 1
            fi
            if grep -qi 'buildservices' "$f"; then
              echo "::error file=$project/$project.csproj::Avalonia.BuildServices targets are imported again - the build-time telemetry opt-out has been lost. Restore the ExcludeAssets=\"all\" PackageReference."
              exit 1
            fi
          done
          echo ">> Avalonia.BuildServices targets are not imported; build-time telemetry is off."

      # The UI tests use xunit.v3.mtp-off so that Microsoft.Testing.Platform, and the telemetry
      # extension it brings, are not in the dependency graph at all (issue #143). A lock file is
      # the exact record of that graph, so this fails if a package change lets it back in -
      # for example a bump that swaps xunit.v3.mtp-off for plain xunit.v3.
      - name: No test-platform telemetry package in any lock file
        shell: bash
        run: |
          set -euo pipefail
          if grep -l 'Microsoft\.Testing\.Extensions\.Telemetry' */packages.lock.json; then
            echo "::error::Microsoft.Testing.Extensions.Telemetry is in the lock file(s) listed above. Use an xunit.v3 *.mtp-off package, or remove whatever pulled in Microsoft.Testing.Platform."
            exit 1
          fi
          echo ">> No lock file names Microsoft.Testing.Extensions.Telemetry."

      # The AppImage is only assembled at release time, so guard the ICU wiring here:
      # without it the Linux build FailFasts at startup on a distro with no system libicu.
      - name: Linux publish carries app-local ICU
        shell: bash
        run: |
          dotnet publish PCEdit.Desktop/PCEdit.Desktop.csproj -c Release -r linux-x64 --self-contained true --no-restore -o "$RUNNER_TEMP/icu-check"
          deploy/verify-app-local-icu.sh "$RUNNER_TEMP/icu-check"

      # A hand-edit of a generated file, or a generator edit that was never re-run, both
      # show up here as a diff.
      - name: Generated files are in sync with their generators
        run: |
          python3 tools/i18n/gen_satellites.py
          python3 tools/i18n/gen_metainfo.py
          python3 tools/item-catalog/gen_catalog.py
          git diff --exit-code --ignore-cr-at-eol -- \
            'PCEdit.App.Core/Resources/Strings.*.resx' \
            deploy/com.valkerran.pcedit.metainfo.xml \
            PCEdit.App.Core/Data/ItemCatalog.json

  # The same three suites as build-test, on the other two platforms the app ships for: file
  # attributes, locks, path forms and links all behave differently there, and several fixes
  # shipped with those behaviours unverified (issue #140).
  #
  # The locked restore is also the cross-OS lock-file check. The lock files are generated on
  # Linux, and the Release workflow restores them in locked mode on Windows and macOS runners
  # too: a graph that resolved differently per OS would otherwise surface only mid-release.
  # The Linux-only checks (app-local ICU, generator drift, telemetry guard) stay in build-test.
  test-cross-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore PCEdit.slnx

      - name: Test — PCEdit.SaveFileHandler
        run: dotnet test PCEdit.SaveFileHandler.Tests/PCEdit.SaveFileHandler.Tests.csproj -c Release --no-restore

      - name: Test — PCEdit.App.Core
        run: dotnet test PCEdit.App.Core.Tests/PCEdit.App.Core.Tests.csproj -c Release --no-restore

      - name: Test — PCEdit.Desktop (headless UI)
        run: dotnet test PCEdit.Desktop.Tests/PCEdit.Desktop.Tests.csproj -c Release --no-restore

  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: <VersionPrefix> is well-formed and not behind the latest release tag
        shell: bash
        run: |
          set -euo pipefail
          v="$(sed -n 's|.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*|\1|p' Directory.Build.props)"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=Directory.Build.props::<VersionPrefix> '$v' is not X.Y.Z"; exit 1
          fi
          latest="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n1)"
          if [ -n "$latest" ]; then
            newest="$(printf '%s\n%s\n' "$v" "$latest" | sort -V | tail -n1)"
            if [ "$v" = "$latest" ]; then
              echo "::warning file=Directory.Build.props::<VersionPrefix> $v already matches release tag v$latest - bump it before the next release."
            elif [ "$newest" != "$v" ]; then
              echo "::error file=Directory.Build.props::<VersionPrefix> $v is behind the latest release tag v$latest"; exit 1
            fi
          fi
