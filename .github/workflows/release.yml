name: Release

# Cuts a GitHub Release with three artifacts:
#   * PCEdit-<v>-x86_64.AppImage       Linux  (self-contained, built on Ubuntu 22.04)
#   * PCEdit-<v>-win-x64.zip           Windows (self-contained)
#   * PCEdit-<v>-macos-x64.zip
#   * PCEdit-<v>-macos-arm64.zip       macOS  (self-contained PCEdit.app, unsigned)
#
# Two ways to trigger it:
#   * push a tag  vX.Y.Z            - X.Y.Z must equal <VersionPrefix> in Directory.Build.props
#   * Actions -> Release -> Run workflow (from main) - reads <VersionPrefix> and
#     creates the vX.Y.Z tag + release for you
#
# See RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default: the build jobs compile and package, they never write to the repo.
# Only the final `release` job, which creates the tag and the GitHub Release, gets write -
# so a compromised build tool never holds a token that can push or publish (#39).
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      # No stored credential: the `git ls-remote` below reads a public repo anonymously.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve & validate version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          prop="$(sed -n 's|.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*|\1|p' Directory.Build.props)"
          if [ -z "$prop" ]; then
            echo "::error::<VersionPrefix> not found in Directory.Build.props"; exit 1
          fi
          if [[ ! "$prop" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::<VersionPrefix> '$prop' is not X.Y.Z"; exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tagver="${GITHUB_REF_NAME#v}"
            if [ "$tagver" != "$prop" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} disagrees with Directory.Build.props <VersionPrefix> ${prop}. Bump the prop, merge, then re-tag."
              exit 1
            fi
          else
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Run the Release workflow from main (was: ${GITHUB_REF_NAME})."; exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v${prop}" >/dev/null 2>&1; then
              echo "::error::Tag v${prop} already exists - bump <VersionPrefix> in Directory.Build.props first."
              exit 1
            fi
          fi

          echo "version=$prop"                             >> "$GITHUB_OUTPUT"
          echo "tag=v$prop"                                 >> "$GITHUB_OUTPUT"
          echo "release=$prop[${GITHUB_RUN_NUMBER}]"        >> "$GITHUB_OUTPUT"
          echo "Release version: $prop (tag v$prop)"        >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: version
    # Oldest practical glibc base so the bundled runtime runs on newer distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build AppImage
        run: deploy/build-appimage.sh "${{ needs.version.outputs.release }}"

      - name: Sanity-check the artifact
        run: |
          f=$(echo artifacts/*.AppImage)
          test -s "$f"
          ./"$f" --appimage-extract >/dev/null
          ! ldd squashfs-root/usr/bin/PCEdit 2>/dev/null | grep -q 'not found'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux
          path: artifacts/*.AppImage
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build win-x64 zip
        shell: pwsh
        run: deploy/build-windows.ps1 -Version ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows
          path: artifacts/*.zip
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build ${{ matrix.rid }} .app zip
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: deploy/build-macos.sh ${{ matrix.rid }} ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-macos-${{ matrix.rid }}
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.AppImage *.zip | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.AppImage
            dist/*.zip
            dist/SHA256SUMS.txt
