# PUPNET DEPLOY: 1.9.0
# Packages the Avalonia desktop head (PCEdit.Desktop) as a self-contained x86_64 AppImage.
# Build with: deploy/build-appimage.sh   (see deploy/README.md)
# Field reference: pupnet --help conf

# APP PREAMBLE
AppBaseName = PCEdit
AppFriendlyName = PCEdit
AppId = com.valkerran.pcedit
# Fallback only. The real version is <VersionPrefix> in the repo-root Directory.Build.props;
# build-appimage.sh / the Release workflow pass it through with --app-version.
AppVersionRelease = 1.0.0[1]
AppShortSummary = Planet Crafter Save Editor
AppDescription = """
    A save-file editor for The Planet Crafter.

    Open a Planet Crafter save file to view and edit players, world terraforming,
    inventories, terra tokens, and teleport locations.

    PCEdit edits Planet Crafter save files directly. A bad edit can corrupt a save
    and lose progress. Always keep a backup of your save file before editing. This
    software is provided as is, without warranty of any kind.
"""
AppLicenseId = GPL-3.0-or-later
AppLicenseFile = ../LICENSE
AppChangeFile =

# PUBLISHER
PublisherName = Valkerran
PublisherId = com.valkerran
PublisherCopyright = Copyright (C) 2026 Valkerran
PublisherLinkName = Source code
PublisherLinkUrl = https://github.com/Valkerran/PCEdit
PublisherEmail =

# DESKTOP INTEGRATION
DesktopNoDisplay = false
DesktopTerminal = false
DesktopFile = pcedit.desktop
StartCommand =
PrimeCategory = Utility
MetaFile = com.valkerran.pcedit.metainfo.xml
IconFiles = """
    icon/pcedit.svg
    icon/pcedit.16x16.png
    icon/pcedit.32x32.png
    icon/pcedit.48x48.png
    icon/pcedit.64x64.png
    icon/pcedit.128x128.png
    icon/pcedit.256x256.png
    icon/pcedit.512x512.png
"""

# DOTNET PUBLISH
DotnetProjectPath = ../PCEdit.Desktop/PCEdit.Desktop.csproj
# Trimming stays OFF: Avalonia XAML and System.Text.Json (ItemCatalog) reflection are
# trim hazards. All 15 locale satellite assemblies must remain in the publish output.
DotnetPublishArgs = -p:Version=${APP_VERSION} --self-contained true -p:DebugType=None -p:DebugSymbols=false -p:PublishTrimmed=false
DotnetPostPublish =
DotnetPostPublishOnWindows =

# PACKAGE OUTPUT
PackageName = PCEdit
OutputDirectory = OUT

# APPIMAGE OPTIONS
AppImageArgs =
AppImageRuntimePath =
AppImageVersionOutput = true

# FLATPAK OPTIONS (unused - AppImage is the only target - but required by the conf schema)
FlatpakPlatformRuntime = org.freedesktop.Platform
FlatpakPlatformSdk = org.freedesktop.Sdk
FlatpakPlatformVersion = 23.08
FlatpakFinishArgs = """
    --socket=wayland
    --socket=fallback-x11
    --share=ipc
    --device=dri
    --filesystem=home
"""
FlatpakBuilderArgs =

# RPM OPTIONS (unused)
RpmAutoReq = false
RpmAutoProv = true
RpmRequires = """
    krb5-libs
    libicu
    openssl-libs
"""

# DEBIAN OPTIONS (unused)
DebianRecommends = """
    libc6
    libgcc1
    libgssapi-krb5-2
    libicu70
    libssl3
    libstdc++6
    zlib1g
"""

# WINDOWS SETUP OPTIONS (unused)
SetupGroupName =
SetupAdminInstall = false
SetupCommandPrompt =
SetupMinWindowsVersion = 10
SetupSignTool =
SetupSuffixOutput =
SetupVersionOutput = false
SetupUninstallScript =
